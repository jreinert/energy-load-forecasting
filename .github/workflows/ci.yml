name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch>=2.9.0 --index-url https://download.pytorch.org/whl/cpu
        pip install pandas numpy scikit-learn joblib holidays requests python-dotenv matplotlib seaborn statsmodels xgboost

    - name: Check syntax
      run: |
        python -m py_compile src/data_pipeline.py
        python -m py_compile src/features.py
        python -m py_compile src/dataset.py
        python -m py_compile src/model.py
        python -m py_compile src/train.py
        python -m py_compile src/evaluate.py
        python -m py_compile app/streamlit_app.py
        echo "All files passed syntax check"

    - name: Test imports and model instantiation
      run: |
        cd src
        python -c "
        import sys
        sys.path.insert(0, '.')
        from model import EnergyLSTM
        from dataset import FEATURE_COLS, TARGET_COL, SEQUENCE_LENGTH, BATCH_SIZE
        import torch

        # Verify model builds correctly
        model = EnergyLSTM(input_size=13, hidden_size=128, num_layers=2, dropout=0.2)
        dummy = torch.randn(32, 168, 13)
        output = model(dummy)
        assert output.shape == torch.Size([32, 1]), f'Unexpected output shape: {output.shape}'

        # Verify constants
        assert SEQUENCE_LENGTH == 168, 'Sequence length mismatch'
        assert BATCH_SIZE == 32, 'Batch size mismatch'
        assert len(FEATURE_COLS) == 13, 'Feature count mismatch'

        print('All tests passed')
        print(f'Model parameters: {model.count_parameters():,}')
        print(f'Output shape: {output.shape}')
        "